<!-- upsert-permission-group-configuration-dialog.component.html -->
<div class="modal fade" #upsertPermissionGroupDialog tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <!-- Header -->
            <app-dialog-header [heading]="isEditMode ? 'Edit Permission Group' : 'Add Permission Group'"
                (closeEvent)="onClose()">
            </app-dialog-header>

            <!-- Body -->
            <div class="modal-body">
                <form [formGroup]="form" (ngSubmit)="onSubmit()">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">
                            Name <span class="text-danger">*</span>
                        </label>
                        <input type="text" class="form-control" formControlName="name" placeholder="Enter name"
                            [ngClass]="{'is-invalid': f['name']?.invalid && f['name']?.touched}">
                        @if (f['name']?.invalid && f['name']?.touched) {
                        <div class="invalid-feedback">
                            @if (f['name']?.errors?.['required']) {
                            <span>Name is required.</span>
                            }
                            @if (f['name']?.errors?.['maxlength']) {
                            <span>Maximum 100 characters.</span>
                            }
                        </div>
                        }
                    </div>
                </form>
            </div>

            <!-- Footer -->
            <div class="modal-footer">
                <button type="button" class="btn btn-danger" (click)="onClose()">
                    Cancel
                </button>
                <button type="button" class="btn btn-primary" (click)="onSubmit()"
                    [disabled]="form.invalid || isSubmitting">
                    @if (isSubmitting) {
                    <span class="spinner-border spinner-border-sm me-2"></span>
                    }
                    {{ isEditMode ? 'Update' : 'Add' }}
                </button>
            </div>
        </div>
    </div>
</div>
