<form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="mb-2">
        <textarea class="form-control" [maxlength]="500" formControlName="description" rows="3" placeholder="Write a comment..."
            [ngClass]="{
        'is-invalid': f['description']?.invalid && f['description']?.touched
      }"></textarea>
        @if (f['description']?.invalid && f['description']?.touched) {
        <div class="invalid-feedback">
            @if (f['description']?.errors?.['required']) {
            <span>Description is required.</span>
            }
            @if (f['description']?.errors?.['maxlength']) {
            <span>Maximum 500 characters.</span>
            }
        </div>
        }
    </div>
    <div class="d-flex justify-content-end gap-2">
        <button type="button" class="btn btn-danger btn-sm" (click)="onCancel()">Cancel</button>
        <button type="submit" class="btn btn-primary btn-sm" [disabled]="form.invalid">
            Submit
        </button>
    </div>
</form>
